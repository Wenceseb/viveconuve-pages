name: Publish static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir _site
          cp *.html *.css *.js *.xml robots.txt favicon.png viveconuve.png wenceslao-uve.jpg clarinete.jpg .nojekyll _site/
          cp -R Imagenes _site/
          mkdir _site/Recursos
          cp Recursos/checklist-7-senales-viveconuve.pdf _site/Recursos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
